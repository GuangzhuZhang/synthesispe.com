<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" role="img" aria-labelledby="title desc">
  <title id="title">Figure 1-1. Diagram of the Dialectical Circulation of Two Kinds of Production</title>
  <desc id="desc">A four-quadrant model showing the circular relations among the enterprise system, commodity market, family system, employment market, financial market, real flows, and monetary flows.</desc>
  <defs>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f47b20"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#21a856"/>
    </marker>
    <style>
      text{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;fill:#111;font-weight:700}
      .small{font-size:18px}.label{font-size:23px}.note{font-size:15px;font-weight:500;fill:#4b5b5f}.flowNote{font-size:14px;font-weight:600;fill:#21a856}.axis{stroke:#111;stroke-width:3}.orange{stroke:#f47b20;stroke-width:3.4;fill:none}.green{stroke:#21a856;stroke-width:3;fill:none}.box{fill:#fff;stroke:#111;stroke-width:2}.money{fill:#fff;stroke:#21a856;stroke-width:2}.greenText{fill:#21a856}.legend{font-size:17px;font-weight:500}
    </style>
  </defs>

  <line class="axis" x1="35" y1="310" x2="825" y2="310"/>
  <line class="axis" x1="430" y1="24" x2="430" y2="600"/>
  <text class="small" x="405" y="70" writing-mode="tb">Supply</text>
  <text class="small" x="448" y="70" writing-mode="tb">Output</text>
  <text class="small" x="405" y="524" writing-mode="tb">Output</text>
  <text class="small" x="448" y="524" writing-mode="tb">Supply</text>
  <text class="small" x="47" y="300">Demand</text>
  <text class="small" x="47" y="336">Input</text>
  <text class="small" x="800" y="300">Input</text>
  <text class="small" x="800" y="336">Demand</text>
  <text class="label" x="82" y="114">II. Commodity Market</text>
  <text class="label" x="636" y="108">I. Enterprise System</text>
  <text class="note" x="636" y="136" font-size="10" textLength="188" lengthAdjust="spacingAndGlyphs">Inputs of factors of production and outputs of goods and services</text>
  <text class="label" x="82" y="548">III. Family System</text>
  <text class="note" x="96" y="568" font-size="10" textLength="300" lengthAdjust="spacingAndGlyphs">Consumption of means of subsistence and reproduction of population and human capital</text>
  <text class="label" x="636" y="548">IV. Employment Market</text>

  

  <circle class="money" cx="430" cy="314" r="47"/>
  <text class="label greenText" x="430" y="294" text-anchor="middle" font-size="18">Financial</text>
  <text class="label greenText" x="430" y="334" text-anchor="middle" font-size="18">Market</text>
  <circle class="money" cx="315" cy="220" r="50"/>
  <text class="small greenText" x="315" y="214" text-anchor="middle">Enterprise</text>
  <text class="small greenText" x="315" y="241" text-anchor="middle">Deposits</text>
  <circle class="money" cx="600" cy="395" r="56"/>
  <text class="small greenText" x="600" y="390" text-anchor="middle">Household</text>
  <text class="small greenText" x="600" y="418" text-anchor="middle">Savings</text>

  <path class="orange" d="M430 130
    C265 130 155 210 155 310
    C155 430 265 515 430 515
    C595 515 705 430 705 310
    C705 210 595 130 430 130"
    marker-mid="url(#orangeArrow)" marker-end="url(#orangeArrow)"/>

  

  <path class="green" d="M205 250 C240 215 267 204 315 220 C355 232 376 258 395 286" marker-end="url(#greenArrow)"/>
  <path class="green" d="M468 287 C494 266 519 258 545 268" marker-end="url(#greenArrow)"/>
  <text class="flowNote" x="190" y="182">Sales receipts</text>
  <text class="flowNote" x="487" y="251">Enterprise reinvestment</text>

  <path class="green" d="M662 380 C615 356 548 350 468 342" marker-end="url(#greenArrow)"/>
  <path class="green" d="M392 343 C356 358 350 368 326 356" marker-end="url(#greenArrow)"/>
  <text class="flowNote" x="665" y="340">Wage income</text>
  <text class="flowNote" x="334" y="388" textLength="180" lengthAdjust="spacingAndGlyphs">Household consumption expenditure</text>

  <line class="orange" x1="470" y1="582" x2="562" y2="582" marker-end="url(#orangeArrow)"/>
  <text class="legend" x="584" y="588" fill="#f47b20" font-size="12" textLength="245" lengthAdjust="spacingAndGlyphs">Real flows: goods, services, and labour-power</text>
  <line class="green" x1="470" y1="610" x2="562" y2="610" marker-end="url(#greenArrow)"/>
  <text class="legend" x="584" y="616" fill="#21a856" font-size="12" textLength="245" lengthAdjust="spacingAndGlyphs">Monetary flows: income, expenditure, savings, and deposits</text>
</svg>



