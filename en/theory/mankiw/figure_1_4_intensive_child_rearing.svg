<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Trade-off between child-rearing costs and population quantity and quality under intensive child-rearing">
  <rect width="720" height="360" fill="#fbfaf7"/>
  <line x1="90" y1="300" x2="640" y2="300" stroke="#222" stroke-width="2"/>
  <line x1="90" y1="300" x2="90" y2="50" stroke="#222" stroke-width="2"/>
  <text x="330" y="352" font-size="15" text-anchor="middle">Education / level of cultivation</text>
  <text x="38" y="178" font-size="16" text-anchor="middle" transform="rotate(-90 38 178)">Cultivation cost per child</text>
  <rect x="135" y="220" width="70" height="80" fill="#dceeff" stroke="#2f6fa8"/>
  <rect x="255" y="185" width="70" height="115" fill="#dceeff" stroke="#2f6fa8"/>
  <rect x="375" y="132" width="70" height="168" fill="#dceeff" stroke="#2f6fa8"/>
  <rect x="495" y="88" width="70" height="212" fill="#dceeff" stroke="#2f6fa8"/>
  <path d="M120 235 C230 210 370 160 590 72" fill="none" stroke="#d94848" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="170" y="323" font-size="14" text-anchor="middle">Primary school</text>
  <text x="290" y="323" font-size="14" text-anchor="middle">Secondary school</text>
  <text x="410" y="323" font-size="14" text-anchor="middle">University</text>
  <text x="530" y="323" font-size="14" text-anchor="middle">Postgraduate</text>
  <text x="430" y="54" font-size="14" fill="#9b3333">Intensive child-rearing frontier</text>
  <text x="130" y="205" font-size="13" fill="#666">More children can be raised</text>
  <text x="486" y="82" font-size="13" fill="#666">Fewer children can be raised</text>
</svg>

