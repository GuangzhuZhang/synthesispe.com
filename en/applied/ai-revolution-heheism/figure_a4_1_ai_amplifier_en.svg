<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Figure A-4-1. AI Capability and Institutional Structure</title><desc id="desc">Two risk tendencies and a degeneration path generated by AI capability interacting with institutional structure.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#355d70"/></marker><style>text{font-family:Arial,"Noto Sans",sans-serif;fill:#17343e}.h{font-size:29px;font-weight:700}.n{font-size:19px;font-weight:700}.s{font-size:16px}.xs{font-size:13px}.left{fill:#fff2ed;stroke:#c16d54;stroke-width:2}.right{fill:#eff8f4;stroke:#4d8f78;stroke-width:2}.top{fill:#f2f6fb;stroke:#577b9a;stroke-width:2}</style></defs>
  <rect width="1200" height="780" fill="#fff"/>
  <rect x="180" y="25" width="840" height="120" rx="14" class="top"/><text x="600" y="61" text-anchor="middle" class="h">AI capability × institutional structure</text><text x="600" y="94" text-anchor="middle" class="s">Technology marks out the boundary of what is possible</text><text x="600" y="120" text-anchor="middle" class="s">Institutions determine which uses are rewarded, how gains are distributed, and who bears the risks</text>
  <path d="M520 145L340 200" stroke="#355d70" stroke-width="3" marker-end="url(#a)"/><path d="M680 145L860 200" stroke="#355d70" stroke-width="3" marker-end="url(#a)"/>
  <rect x="60" y="205" width="470" height="315" rx="16" class="left"/><text x="295" y="245" text-anchor="middle" class="h">Binary tendency</text><text x="295" y="283" text-anchor="middle" class="n">Substitution-oriented route</text><text x="295" y="315" text-anchor="middle" class="s">Distribution according to computing power</text><text x="295" y="345" text-anchor="middle" class="s">Absence of governance</text><text x="295" y="375" text-anchor="middle" class="s">International zero-sum race</text><text x="295" y="420" text-anchor="middle" class="n">Risk tendency</text><text x="295" y="451" text-anchor="middle" class="s">Productive Forces overwhelm Life-Reproduction Capacity</text><text x="295" y="482" text-anchor="middle" class="s">the “provision” model or the loss-of-control model</text>
  <rect x="670" y="205" width="470" height="315" rx="16" class="right"/><text x="905" y="245" text-anchor="middle" class="h">Triadic tendency</text><text x="905" y="283" text-anchor="middle" class="n">Complementarity-oriented route</text><text x="905" y="315" text-anchor="middle" class="s">Distribution according to need</text><text x="905" y="345" text-anchor="middle" class="s">Reallocation of the Grand Tripartite</text><text x="905" y="375" text-anchor="middle" class="s">Multipolar <tspan font-style="italic">hehe</tspan> governance</text><text x="905" y="420" text-anchor="middle" class="n">Possible prospect</text><text x="905" y="451" text-anchor="middle" class="s">Life-Reproduction Capacity and Productive Forces rebalanced</text><text x="905" y="482" text-anchor="middle" class="s">the symbiosis model or the sovereignty model</text>
  <text x="600" y="553" text-anchor="middle" class="s">Two risk tendencies, not determinate end states</text>
  <path d="M905 525C845 590 745 606 650 620" stroke="#a35f52" stroke-width="2.5" fill="none" stroke-dasharray="8 7" marker-end="url(#a)"/><rect x="180" y="590" width="840" height="72" rx="12" fill="#fff7e8" stroke="#b28b45" stroke-width="2"/><text x="600" y="620" text-anchor="middle" class="s">Degeneration: family pole without real organizational capacity + government captured by enterprises</text><text x="600" y="646" text-anchor="middle" class="s">→ collusion between government and business, with participation in form only</text>
  <text x="600" y="697" text-anchor="middle" class="n">Tasks and employment · The family’s situation · Rights and governance</text><text x="600" y="725" text-anchor="middle" class="xs">Demographic indicators such as the fertility rate are watched separately as long-run outcome variables and do not serve as an instantaneous criterion.</text>
  <text x="600" y="760" text-anchor="middle" class="n">Figure A-4-1. AI Capability and Institutional Structure: Two Tendencies and One Path of Degeneration</text>
</svg>
