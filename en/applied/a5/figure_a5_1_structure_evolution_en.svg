<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Figure A-5-1. Evolution of China's Social Organizational Structure</title><desc id="desc">Four-stage schematic from imperial binary opposition through a triadic structure and a possible AI-era quadripartite structure.</desc>
  <defs><style>text{font-family:Arial,"Noto Sans",sans-serif;fill:#183640}.h{font-size:24px;font-weight:700}.n{font-size:18px;font-weight:700}.s{font-size:15px}.xs{font-size:13px}.stage{fill:#f7fbfc;stroke:#6f98a6;stroke-width:2}.node{fill:#eef7f4;stroke:#4d8f78;stroke-width:2}.muted{fill:#f4f4f4;stroke:#999;stroke-width:2;stroke-dasharray:6 5}</style></defs>
  <rect width="1280" height="720" fill="#fff"/>
  <line x1="90" y1="85" x2="1190" y2="85" stroke="#6f98a6" stroke-width="4"/><circle cx="180" cy="85" r="9" fill="#6f98a6"/><circle cx="485" cy="85" r="9" fill="#6f98a6"/><circle cx="790" cy="85" r="9" fill="#6f98a6"/><circle cx="1100" cy="85" r="9" fill="#6f98a6"/>
  <text x="180" y="50" text-anchor="middle" class="h">Two millennia of imperial rule</text><text x="485" y="50" text-anchor="middle" class="h">Planned economy</text><text x="790" y="50" text-anchor="middle" class="h">Reform and opening</text><text x="1100" y="50" text-anchor="middle" class="h">The AI era?</text>
  <rect x="55" y="125" width="250" height="330" rx="14" class="stage"/><rect x="90" y="175" width="80" height="62" rx="9" class="node"/><text x="130" y="211" text-anchor="middle" class="n">Imperial</text><text x="130" y="230" text-anchor="middle" class="xs">power</text><rect x="190" y="300" width="80" height="62" rx="9" class="node"/><text x="230" y="336" text-anchor="middle" class="n">Popular</text><text x="230" y="355" text-anchor="middle" class="xs">rights</text><line x1="165" y1="235" x2="210" y2="300" stroke="#a65f52" stroke-width="4"/><text x="180" y="395" text-anchor="middle" class="s">officialdom–people binary</text><text x="180" y="420" text-anchor="middle" class="s">cycle of order and disorder</text>
  <rect x="360" y="125" width="250" height="330" rx="14" class="stage"/><rect x="440" y="160" width="90" height="62" rx="9" class="node"/><text x="485" y="197" text-anchor="middle" class="n">Government</text><rect x="385" y="295" width="90" height="70" rx="9" class="muted"/><text x="430" y="327" text-anchor="middle" class="n">Enterprise</text><text x="430" y="349" text-anchor="middle" class="xs">workshop</text><rect x="495" y="295" width="90" height="70" rx="9" class="muted"/><text x="540" y="327" text-anchor="middle" class="n">Family</text><text x="540" y="349" text-anchor="middle" class="xs">work-unit person</text><line x1="485" y1="222" x2="430" y2="295" stroke="#6f98a6" stroke-width="3"/><line x1="485" y1="222" x2="540" y2="295" stroke="#6f98a6" stroke-width="3"/><text x="485" y="395" text-anchor="middle" class="s">“one-and-a-half-element” structure</text><text x="485" y="420" text-anchor="middle" class="s">tighten and it dies · loosen and disorder follows</text>
  <rect x="665" y="125" width="250" height="330" rx="14" class="stage"/><rect x="750" y="155" width="80" height="60" rx="9" class="node"/><text x="790" y="191" text-anchor="middle" class="n">Government</text><rect x="690" y="300" width="80" height="60" rx="9" class="node"/><text x="730" y="336" text-anchor="middle" class="n">Family</text><rect x="810" y="300" width="80" height="60" rx="9" class="node"/><text x="850" y="336" text-anchor="middle" class="n">Enterprise</text><path d="M770 215L740 300M810 215L840 300M770 330H810" stroke="#4d8f78" stroke-width="4" fill="none"/><text x="790" y="395" text-anchor="middle" class="s">triadic structure</text><text x="790" y="420" text-anchor="middle" class="s">growth miracle · checks and balances evolving</text>
  <rect x="970" y="125" width="255" height="330" rx="14" class="stage"/><rect x="1060" y="150" width="80" height="55" rx="9" class="node"/><text x="1100" y="184" text-anchor="middle" class="n">Government</text><rect x="995" y="285" width="75" height="55" rx="9" class="node"/><text x="1032" y="319" text-anchor="middle" class="n">Family</text><rect x="1130" y="285" width="75" height="55" rx="9" class="node"/><text x="1167" y="319" text-anchor="middle" class="n">Enterprise</text><rect x="1060" y="370" width="80" height="55" rx="9" fill="#fff7e8" stroke="#b28b45" stroke-width="2"/><text x="1100" y="404" text-anchor="middle" class="n">AI</text><path d="M1100 205L1032 285M1100 205L1167 285M1032 340L1100 370M1167 340L1100 370" stroke="#6f98a6" stroke-width="3" fill="none"/><text x="1100" y="445" text-anchor="middle" class="s">quadripartite structure? (A-2)</text>
  <line x1="65" y1="495" x2="1215" y2="495" stroke="#d7e0e3"/><text x="640" y="535" text-anchor="middle" class="h">Figure A-5-1. The Evolution of China’s Social Organizational Structure:</text><text x="640" y="565" text-anchor="middle" class="h">From Binary Opposition to a Triadic Structure</text><text x="640" y="594" text-anchor="middle" class="s">The three subjects have formed; checks and balances are still evolving.</text><text x="640" y="638" text-anchor="middle" class="s">Structure determines dynamics: binary structures oscillate like a pendulum; triadic structures permit dynamic equilibrium.</text><text x="640" y="665" text-anchor="middle" class="s">At the next structural transition, countries may once again stand near the same starting line.</text>
</svg>
