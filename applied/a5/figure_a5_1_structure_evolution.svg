<svg viewBox="0 0 920 410" xmlns="http://www.w3.org/2000/svg" font-family="Noto Serif SC, Noto Serif CJK SC, Georgia, serif">
  <defs>
    <marker id="eGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="eGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b6914"/>
    </marker>
    <marker id="eBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a4a7a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="410" fill="#faf9f7"/>

  <!-- 阶段推进箭头 -->
  <line x1="228" y1="172" x2="256" y2="172" stroke="#8b6914" stroke-width="2" marker-end="url(#eGold)"/>
  <line x1="448" y1="172" x2="476" y2="172" stroke="#8b6914" stroke-width="2" marker-end="url(#eGold)"/>
  <line x1="668" y1="172" x2="696" y2="172" stroke="#8b6914" stroke-width="2" marker-end="url(#eGold)"/>

  <!-- ① 帝制两千年 -->
  <text x="130" y="56" font-size="15" font-weight="bold" fill="#5f5f5f" text-anchor="middle">帝制两千年</text>
  <rect x="72" y="86" width="116" height="42" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="130" y="112" font-size="14" font-weight="bold" fill="#5f5f5f" text-anchor="middle">君　权</text>
  <line x1="118" y1="134" x2="118" y2="212" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#eGray)"/>
  <line x1="142" y1="212" x2="142" y2="134" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#eGray)"/>
  <rect x="72" y="218" width="116" height="42" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="130" y="244" font-size="14" font-weight="bold" fill="#5f5f5f" text-anchor="middle">民　权</text>
  <text x="130" y="292" font-size="12" fill="#8a8a8a" text-anchor="middle">官民二元对立</text>
  <text x="130" y="310" font-size="12" fill="#8a8a8a" text-anchor="middle">治乱循环 · 改朝换代</text>

  <!-- ② 计划经济 -->
  <text x="352" y="56" font-size="15" font-weight="bold" fill="#5f5f5f" text-anchor="middle">计划经济</text>
  <rect x="268" y="86" width="168" height="174" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
  <text x="352" y="112" font-size="14" font-weight="bold" fill="#5f5f5f" text-anchor="middle">政　府</text>
  <rect x="282" y="136" width="66" height="52" rx="3" fill="#f0eeea" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="315" y="158" font-size="12.5" fill="#5f5f5f" text-anchor="middle">企业</text>
  <text x="315" y="177" font-size="10.5" fill="#8a8a8a" text-anchor="middle">（车间）</text>
  <rect x="356" y="136" width="66" height="52" rx="3" fill="#f0eeea" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="389" y="158" font-size="12.5" fill="#5f5f5f" text-anchor="middle">家庭</text>
  <text x="389" y="177" font-size="10.5" fill="#8a8a8a" text-anchor="middle">（单位人）</text>
  <text x="352" y="222" font-size="11.5" fill="#8a8a8a" text-anchor="middle">企业、家庭失去独立性</text>
  <text x="352" y="292" font-size="12" fill="#8a8a8a" text-anchor="middle">"一元半"结构</text>
  <text x="352" y="310" font-size="12" fill="#8a8a8a" text-anchor="middle">一收就死 · 一放就乱</text>

  <!-- ③ 改革开放 -->
  <text x="572" y="56" font-size="15" font-weight="bold" fill="#1a4a7a" text-anchor="middle">改革开放</text>
  <line x1="546" y1="126" x2="516" y2="212" stroke="#1a4a7a" stroke-width="1.6" marker-start="url(#eBlue)" marker-end="url(#eBlue)"/>
  <line x1="598" y1="126" x2="628" y2="212" stroke="#1a4a7a" stroke-width="1.6" marker-start="url(#eBlue)" marker-end="url(#eBlue)"/>
  <line x1="536" y1="234" x2="608" y2="234" stroke="#1a4a7a" stroke-width="1.6" marker-start="url(#eBlue)" marker-end="url(#eBlue)"/>
  <rect x="532" y="88" width="80" height="38" rx="4" fill="#ffffff" stroke="#1a4a7a" stroke-width="1.8"/>
  <text x="572" y="112" font-size="13.5" font-weight="bold" fill="#1a4a7a" text-anchor="middle">政　府</text>
  <rect x="480" y="216" width="72" height="38" rx="4" fill="#ffffff" stroke="#1a4a7a" stroke-width="1.8"/>
  <text x="516" y="240" font-size="13.5" font-weight="bold" fill="#1a4a7a" text-anchor="middle">家　庭</text>
  <rect x="592" y="216" width="72" height="38" rx="4" fill="#ffffff" stroke="#1a4a7a" stroke-width="1.8"/>
  <text x="628" y="240" font-size="13.5" font-weight="bold" fill="#1a4a7a" text-anchor="middle">企　业</text>
  <circle cx="572" cy="178" r="16" fill="#ffffff" stroke="#8b6914" stroke-width="1.6"/>
  <text x="572" y="183" font-size="10.5" fill="#8b6914" text-anchor="middle">均衡</text>
  <text x="572" y="292" font-size="12" fill="#1a4a7a" text-anchor="middle">三元结构</text>
  <text x="572" y="310" font-size="12" fill="#1a4a7a" text-anchor="middle">增长奇迹 · 仍在完善</text>

  <!-- ④ AI时代 -->
  <text x="795" y="56" font-size="15" font-weight="bold" fill="#8b6914" text-anchor="middle">AI时代？</text>
  <line x1="772" y1="120" x2="748" y2="188" stroke="#1a4a7a" stroke-width="1.3"/>
  <line x1="818" y1="120" x2="842" y2="188" stroke="#1a4a7a" stroke-width="1.3"/>
  <line x1="762" y1="206" x2="828" y2="206" stroke="#1a4a7a" stroke-width="1.3"/>
  <rect x="760" y="86" width="70" height="34" rx="4" fill="#ffffff" stroke="#1a4a7a" stroke-width="1.5"/>
  <text x="795" y="108" font-size="12.5" fill="#1a4a7a" text-anchor="middle">政府</text>
  <rect x="714" y="190" width="64" height="34" rx="4" fill="#ffffff" stroke="#1a4a7a" stroke-width="1.5"/>
  <text x="746" y="212" font-size="12.5" fill="#1a4a7a" text-anchor="middle">家庭</text>
  <rect x="812" y="190" width="64" height="34" rx="4" fill="#ffffff" stroke="#1a4a7a" stroke-width="1.5"/>
  <text x="844" y="212" font-size="12.5" fill="#1a4a7a" text-anchor="middle">企业</text>
  <circle cx="795" cy="262" r="20" fill="#ffffff" stroke="#8b6914" stroke-width="1.6" stroke-dasharray="5,4"/>
  <text x="795" y="267" font-size="12" font-weight="bold" fill="#8b6914" text-anchor="middle">AI</text>
  <line x1="782" y1="247" x2="756" y2="226" stroke="#8b6914" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="808" y1="247" x2="834" y2="226" stroke="#8b6914" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="795" y1="242" x2="795" y2="122" stroke="#8b6914" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="795" y="310" font-size="12" fill="#8b6914" text-anchor="middle">四元结构？（《奇点之后》）</text>

  <!-- 图题 -->
  <text x="460" y="358" font-size="15" font-weight="bold" fill="#1a4a7a" text-anchor="middle">图A-5-1　中国社会组织结构的演进——从二元对立到三元结构</text>
  <text x="460" y="382" font-size="11.5" fill="#6b6b6b" text-anchor="middle">结构决定动力学：二元结构钟摆震荡，三元结构动态均衡；下一次结构跃迁，各国站在同一起跑线上。</text>
</svg>
