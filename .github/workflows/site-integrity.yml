name: Site integrity

on:
  push:
  pull_request:

jobs:
  registry-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check registry and rendered-page contract
        run: python tools/check_registry_contract.py
