<svg viewBox="0 0 860 600" xmlns="http://www.w3.org/2000/svg" font-family="&quot;Noto Serif SC&quot;, &quot;Noto Serif CJK SC&quot;, &quot;Source Han Serif SC&quot;, &quot;Songti SC&quot;, &quot;SimSun&quot;, Georgia, serif" style="background:#faf9f7">
  <defs>
    <marker id="rb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a3324"/></marker>
    <marker id="bl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a4a7a"/></marker>
    <marker id="gd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b6914"/></marker>
  </defs>
  <rect x="0" y="0" width="860" height="600" fill="#faf9f7"/>

  <!-- 三个部门 -->
  <rect x="90" y="360" width="150" height="70" rx="6" fill="#ffffff" stroke="#1a4a7a" stroke-width="2"/>
  <text x="165" y="390" font-size="16" font-weight="bold" fill="#1a4a7a" text-anchor="middle">家　庭</text>
  <text x="165" y="412" font-size="11" fill="#6b6b6b" text-anchor="middle">人口再生产</text>

  <rect x="620" y="360" width="150" height="70" rx="6" fill="#ffffff" stroke="#1a4a7a" stroke-width="2"/>
  <text x="695" y="390" font-size="16" font-weight="bold" fill="#1a4a7a" text-anchor="middle">企　业</text>
  <text x="695" y="412" font-size="11" fill="#6b6b6b" text-anchor="middle">产品生产</text>

  <rect x="355" y="90" width="150" height="70" rx="6" fill="#ffffff" stroke="#8b6914" stroke-width="2"/>
  <text x="430" y="120" font-size="16" font-weight="bold" fill="#8b6914" text-anchor="middle">政　府</text>
  <text x="430" y="142" font-size="11" fill="#6b6b6b" text-anchor="middle">公共产品生产</text>

  <!-- 中央:市场与货币流通 -->
  <ellipse cx="430" cy="300" rx="96" ry="52" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="430" y="294" font-size="13" font-weight="bold" fill="#5f5f5f" text-anchor="middle">市场与货币流通</text>
  <text x="430" y="314" font-size="10.5" fill="#8a8a8a" text-anchor="middle">商品·要素·信贷·国债</text>

  <!-- 家庭↔企业:实体循环(红) -->
  <path d="M 240 380 Q 430 430 620 380" fill="none" stroke="#8a3324" stroke-width="2" marker-end="url(#rb)"/>
  <text x="430" y="426" font-size="11" fill="#8a3324" text-anchor="middle">劳动力 N（要素）</text>
  <path d="M 620 410 Q 430 470 240 410" fill="none" stroke="#8a3324" stroke-width="2" marker-end="url(#rb)"/>
  <text x="430" y="466" font-size="11" fill="#8a3324" text-anchor="middle">产品与服务 C</text>

  <!-- 家庭↔市场 货币(蓝) -->
  <line x1="200" y1="360" x2="360" y2="300" stroke="#1a4a7a" stroke-width="1.5" marker-end="url(#bl)"/>
  <text x="238" y="330" font-size="10.5" fill="#1a4a7a" text-anchor="middle">消费支出</text>
  <line x1="360" y1="316" x2="205" y2="360" stroke="#1a4a7a" stroke-width="1.5" marker-end="url(#bl)"/>
  <text x="300" y="352" font-size="10.5" fill="#1a4a7a" text-anchor="middle">工资收入</text>

  <!-- 企业↔市场 货币(蓝) -->
  <line x1="660" y1="360" x2="500" y2="300" stroke="#1a4a7a" stroke-width="1.5" marker-end="url(#bl)"/>
  <text x="622" y="330" font-size="10.5" fill="#1a4a7a" text-anchor="middle">销售收入</text>
  <line x1="500" y1="316" x2="655" y2="360" stroke="#1a4a7a" stroke-width="1.5" marker-end="url(#bl)"/>
  <text x="560" y="352" font-size="10.5" fill="#1a4a7a" text-anchor="middle">要素支出</text>

  <!-- 政府↔家庭/企业:非市场(金,虚线) -->
  <line x1="360" y1="130" x2="180" y2="356" stroke="#8b6914" stroke-width="1.6" stroke-dasharray="6,4" marker-start="url(#gd)" marker-end="url(#gd)"/>
  <text x="248" y="250" font-size="10" fill="#8b6914" text-anchor="middle" transform="rotate(-52 248 250)">税收⇄公共产品</text>
  <line x1="500" y1="130" x2="680" y2="356" stroke="#8b6914" stroke-width="1.6" stroke-dasharray="6,4" marker-start="url(#gd)" marker-end="url(#gd)"/>
  <text x="612" y="250" font-size="10" fill="#8b6914" text-anchor="middle" transform="rotate(52 612 250)">税收⇄公共产品</text>
  <line x1="430" y1="160" x2="430" y2="242" stroke="#8b6914" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#gd)"/>
  <text x="486" y="204" font-size="10" fill="#8b6914" text-anchor="middle">财政·货币政策</text>

  <!-- 失衡节点标注 -->
  <circle cx="430" cy="466" r="5" fill="#8a3324"/>
  <text x="430" y="500" font-size="11" font-weight="bold" fill="#8a3324" text-anchor="middle">失衡节点：非意愿存货 ↑，产能闲置</text>
  <text x="430" y="520" font-size="10" fill="#8a8a8a" text-anchor="middle">（会计恒等式仍配平，却不解释失衡为何发生）</text>

  <!-- 图例 -->
  <line x1="120" y1="548" x2="150" y2="548" stroke="#8a3324" stroke-width="2"/>
  <text x="156" y="552" font-size="10.5" fill="#5f5f5f">实体流（要素·产品）</text>
  <line x1="330" y1="548" x2="360" y2="548" stroke="#1a4a7a" stroke-width="2"/>
  <text x="366" y="552" font-size="10.5" fill="#5f5f5f">货币流（市场交易）</text>
  <line x1="545" y1="548" x2="575" y2="548" stroke="#8b6914" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="581" y="552" font-size="10.5" fill="#5f5f5f">非市场流（税收·公共产品）</text>

  <!-- 图题 -->
  <text x="430" y="580" font-size="14" font-weight="bold" fill="#1a4a7a" text-anchor="middle">图23-1　三部门循环流量与失衡节点（本站原创示意）</text>
</svg>
