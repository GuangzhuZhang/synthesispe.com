<svg width="920" height="660" viewBox="0 0 920 660" xmlns="http://www.w3.org/2000/svg" font-family="Noto Serif SC, Noto Serif CJK SC, Georgia, serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a4a7a"/>
    </marker>
    <marker id="arrowBlueLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a4a7a" fill-opacity="0.55"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b6914"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="920" height="660" fill="#faf9f7"/>

  <!-- 货币流通与三方的虚连线（介质示意） -->
  <line x1="460" y1="272" x2="460" y2="140" stroke="#b9b3a8" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="414" y1="366" x2="282" y2="428" stroke="#b9b3a8" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="506" y1="366" x2="638" y2="428" stroke="#b9b3a8" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- 政府 ↔ 家庭：非市场交易（金色虚线） -->
  <line x1="230" y1="426" x2="393" y2="140" stroke="#8b6914" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowGold)"/>
  <line x1="355" y1="140" x2="192" y2="426" stroke="#8b6914" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowGold)"/>
  <text x="292" y="402" font-size="14" fill="#8b6914" text-anchor="middle">税收</text>
  <text x="212" y="212" font-size="14" fill="#8b6914" text-anchor="middle">公共产品 · 转移支付</text>

  <!-- 政府 ↔ 企业：非市场交易（金色虚线） -->
  <line x1="690" y1="426" x2="527" y2="140" stroke="#8b6914" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowGold)"/>
  <line x1="565" y1="140" x2="728" y2="426" stroke="#8b6914" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowGold)"/>
  <text x="628" y="402" font-size="14" fill="#8b6914" text-anchor="middle">税收</text>
  <text x="712" y="212" font-size="14" fill="#8b6914" text-anchor="middle">公共产品 · 营商环境</text>

  <!-- 家庭 ↔ 企业：市场交易（蓝色实线） -->
  <text x="460" y="424" font-size="13" fill="#8b6914" text-anchor="middle" letter-spacing="2">就 业 市 场</text>
  <line x1="310" y1="456" x2="608" y2="456" stroke="#1a4a7a" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="460" y="450" font-size="13" fill="#1a4a7a" text-anchor="middle" dy="-1">劳动力 · 人力资本</text>
  <line x1="610" y1="474" x2="312" y2="474" stroke="#1a4a7a" stroke-width="1.4" stroke-opacity="0.55" marker-end="url(#arrowBlueLight)"/>
  <text x="460" y="488" font-size="12" fill="#1a4a7a" fill-opacity="0.75" text-anchor="middle">工资（货币流）</text>

  <line x1="610" y1="510" x2="312" y2="510" stroke="#1a4a7a" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="460" y="505" font-size="13" fill="#1a4a7a" text-anchor="middle">消费品与服务</text>
  <line x1="310" y1="528" x2="608" y2="528" stroke="#1a4a7a" stroke-width="1.4" stroke-opacity="0.55" marker-end="url(#arrowBlueLight)"/>
  <text x="460" y="544" font-size="12" fill="#1a4a7a" fill-opacity="0.75" text-anchor="middle">消费支出（货币流）</text>
  <text x="460" y="562" font-size="13" fill="#8b6914" text-anchor="middle" letter-spacing="2">生 活 要 素 市 场</text>

  <!-- 政府 -->
  <rect x="340" y="40" width="240" height="100" rx="6" fill="#ffffff" stroke="#1a4a7a" stroke-width="2"/>
  <text x="460" y="72" font-size="22" font-weight="bold" fill="#1a4a7a" text-anchor="middle">政　府</text>
  <text x="460" y="97" font-size="14" fill="#2a2a2a" text-anchor="middle">公共产品生产</text>
  <text x="460" y="120" font-size="12.5" fill="#6b6b6b" text-anchor="middle">追求：税收 → 权力最大化</text>
  <text x="460" y="200" font-size="12.5" fill="#8b6914" text-anchor="middle" font-style="italic">货币政策 · 财政政策</text>
  <text x="460" y="218" font-size="11" fill="#8b6914" text-anchor="middle" font-style="italic">（中间支点）</text>

  <!-- 家庭 -->
  <rect x="62" y="430" width="240" height="100" rx="6" fill="#ffffff" stroke="#1a4a7a" stroke-width="2"/>
  <text x="182" y="462" font-size="22" font-weight="bold" fill="#1a4a7a" text-anchor="middle">家　庭</text>
  <text x="182" y="487" font-size="14" fill="#2a2a2a" text-anchor="middle">人口 · 人力资源生产</text>
  <text x="182" y="510" font-size="12.5" fill="#6b6b6b" text-anchor="middle">追求：工资 → 幸福最大化</text>

  <!-- 企业 -->
  <rect x="618" y="430" width="240" height="100" rx="6" fill="#ffffff" stroke="#1a4a7a" stroke-width="2"/>
  <text x="738" y="462" font-size="22" font-weight="bold" fill="#1a4a7a" text-anchor="middle">企　业</text>
  <text x="738" y="487" font-size="14" fill="#2a2a2a" text-anchor="middle">产品与服务生产</text>
  <text x="738" y="510" font-size="12.5" fill="#6b6b6b" text-anchor="middle">追求：资本 → 利润最大化</text>

  <!-- 货币流通（介质） -->
  <circle cx="460" cy="330" r="58" fill="#ffffff" stroke="#8b6914" stroke-width="2"/>
  <circle cx="460" cy="330" r="50" fill="none" stroke="#8b6914" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="460" y="327" font-size="17" font-weight="bold" fill="#8b6914" text-anchor="middle">货币流通</text>
  <text x="460" y="349" font-size="10.5" fill="#6b6b6b" text-anchor="middle">信贷货币 · 国债货币</text>

  <!-- 图例 -->
  <line x1="150" y1="600" x2="205" y2="600" stroke="#1a4a7a" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="215" y="605" font-size="13" fill="#2a2a2a">市场交易（商品流 · 货币流，价格机制）</text>
  <line x1="530" y1="600" x2="585" y2="600" stroke="#8b6914" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowGold)"/>
  <text x="595" y="605" font-size="13" fill="#2a2a2a">非市场交易（税收—公共产品，非价格均衡）</text>

  <!-- 图题 -->
  <text x="460" y="642" font-size="15" font-weight="bold" fill="#1a4a7a" text-anchor="middle">图2-1　“三种生产”与货币流通的宏观经济模型</text>
</svg>
